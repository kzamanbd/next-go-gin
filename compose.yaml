services:
  api:
    build:
      context: apps/api
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Server-side proxy target for /api/* (baked in at build time).
        API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
